<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Fluir Watch Together</title>
  <style nonce="__NONCE__">
    :root{--cyan:#20e6d1;--blue:#7180ff;--pink:#ff4d91;--text:#f8f9ff;--muted:#aab3ca;--danger:#ff8fab}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:var(--text);font:14px/1.35 Inter,ui-sans-serif,system-ui,sans-serif}
    button,input,select{font:inherit}.stage{position:relative;width:100%;height:100%;background:#000;isolation:isolate}.player,.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.player.viewer iframe{pointer-events:none}
    .loading{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:24px;text-align:center;background:#050609}.loading.hidden{display:none}.spinner{width:44px;height:44px;margin:0 auto 14px;border:4px solid #ffffff20;border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.muted{margin-top:7px;color:var(--muted)}.error{color:var(--danger)}
    .source-card{width:min(560px,calc(100vw - 32px));padding:24px;border:1px solid #ffffff22;border-radius:18px;background:#0b0e16eF;box-shadow:0 30px 100px #000}.source-card h1{margin:0 0 8px;font-size:21px}.source-card p{margin:0 0 17px;color:var(--muted)}.source-row{display:flex;gap:9px}.source-row input{min-width:0;flex:1;padding:13px 14px;border:1px solid #35405d;border-radius:11px;outline:0;background:#151b2b;color:#fff}.source-row input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #20e6d11c}.source-row button{border:0;border-radius:11px;padding:0 18px;background:linear-gradient(135deg,var(--blue),#9868ff);color:#fff;font-weight:850;cursor:pointer}.source-error{min-height:19px;margin-top:9px;color:var(--danger)}
    .chrome{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;background:linear-gradient(180deg,#0009 0,transparent 23%,transparent 65%,#000e 100%);opacity:0;transition:opacity .2s ease}.stage:hover .chrome,.stage.controls-visible .chrome,.chrome:focus-within{opacity:1}.topbar,.controls{pointer-events:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(15px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 12px max(18px,env(safe-area-inset-left))}.brand{font-size:15px;font-weight:900;letter-spacing:.02em}.role{padding:7px 10px;border:1px solid #ffffff24;border-radius:999px;background:#080a10a8;color:var(--muted);font-size:12px}.role.host{border-color:#20e6d155;color:var(--cyan)}
    .controls{padding:18px max(20px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}.timeline{display:grid;grid-template-columns:auto minmax(80px,1fr) auto;align-items:center;gap:12px;font-variant-numeric:tabular-nums}.timeline input{width:100%;height:5px;margin:0;accent-color:var(--pink);cursor:pointer}.timeline input:disabled{cursor:default}.control-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:12px}.cluster{display:flex;align-items:center;gap:8px}.icon{min-width:42px;height:42px;border:1px solid #ffffff24;border-radius:11px;background:#171a24d9;color:#fff;font-weight:850;cursor:pointer}.icon:hover{border-color:#fff}.icon:disabled{opacity:.38;cursor:not-allowed}.primary{min-width:54px;border:0;background:#fff;color:#08090d;font-size:17px}.caption{height:42px;border:1px solid #ffffff24;border-radius:11px;padding:0 10px;background:#171a24;color:#fff;cursor:pointer}.status{max-width:42vw;overflow:hidden;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}.viewer-note{display:none;color:var(--muted);font-size:12px}.viewer-mode .host-control{display:none}.viewer-mode .viewer-note{display:block}
    @media(max-width:620px){.topbar{padding:12px}.controls{padding:12px}.status{display:none}.icon{min-width:38px;height:38px}.source-row{flex-direction:column}.source-row button{height:44px}.caption{max-width:110px}.timeline{gap:8px}}
  </style>
</head>
<body>
<main id="stage" class="stage controls-visible">
  <div id="player" class="player viewer"></div>
  <section id="loading" class="loading"><div><div class="spinner"></div><strong id="loadingTitle">Discord oturumu doğrulanıyor…</strong><div id="loadingDetail" class="muted">Fluir kamera, mikrofon veya konum izni istemez.</div></div></section>
  <section id="sourceGate" class="loading hidden">
    <form id="sourceForm" class="source-card" autocomplete="off">
      <h1 id="sourceTitle">Yayını başlat</h1>
      <p id="sourceHint">Yalnızca yerleştirmeye izin veren bir YouTube video bağlantısı kullan.</p>
      <div id="sourceFields" class="source-row"><input id="sourceUrl" type="url" inputmode="url" maxlength="500" required placeholder="https://www.youtube.com/watch?v=…" aria-label="YouTube video bağlantısı"><button type="submit">Videoyu aç</button></div>
      <div id="sourceError" class="source-error" role="alert"></div>
    </form>
  </section>
  <section id="chrome" class="chrome viewer-mode">
    <header class="topbar"><div class="brand">FLUIR · WATCH TOGETHER</div><div id="role" class="role">İzleyici</div></header>
    <footer class="controls">
      <div class="timeline"><span id="current">00:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.1" disabled aria-label="Video konumu"><span id="duration">00:00</span></div>
      <div class="control-row">
        <div class="cluster">
          <button id="back" class="icon host-control" type="button" title="10 saniye geri">−10</button>
          <button id="play" class="icon primary host-control" type="button" title="Oynat veya duraklat">▶</button>
          <button id="forward" class="icon host-control" type="button" title="10 saniye ileri">+10</button>
          <span class="viewer-note">Yayını yalnızca oda sahibi yönetebilir.</span>
        </div>
        <div id="status" class="status">Bağlanıyor…</div>
        <div class="cluster">
          <select id="captions" class="caption" aria-label="Altyazı dili"><option value="off">Altyazı kapalı</option><option value="tr">Türkçe altyazı</option><option value="en">English captions</option></select>
          <button id="mute" class="icon" type="button" title="Sesi aç veya kapat">🔊</button>
          <button id="fullscreen" class="icon" type="button" title="Tam ekran">⛶</button>
        </div>
      </div>
    </footer>
  </section>
</main>
<script src="/assets/discord-sdk.js"></script>
<script nonce="__NONCE__">
  const clientId="__DISCORD_CLIENT_ID__",byId=id=>document.getElementById(id),PLAYING=1,PAUSED=2;
  let discordSdk,roomId,videoId="",playerFrame,playerReady=false,playerState=-1,playerCurrent=0,playerDuration=0,lastRemote,events,controller=false,applying=false,muted=false,hideTimer,playbackWatchdog,seeking=false;
  const clock=value=>{value=Math.max(0,Math.floor(value||0));const h=Math.floor(value/3600),m=Math.floor(value%3600/60),s=value%60;return h?[h,m,s].map((n,i)=>i?String(n).padStart(2,"0"):n).join(":"):[m,s].map(n=>String(n).padStart(2,"0")).join(":")};
  const showControls=()=>{byId("stage").classList.add("controls-visible");clearTimeout(hideTimer);hideTimer=setTimeout(()=>byId("stage").classList.remove("controls-visible"),2800)};
  const fail=(title,detail)=>{byId("loading").classList.remove("hidden");byId("loadingTitle").textContent=title;byId("loadingDetail").textContent=detail;byId("loadingDetail").classList.add("error");byId("status").textContent="Bağlantı hatası"};
  async function boot(){
    try{
      if(!window.DiscordEmbeddedAppSDK?.DiscordSDK)throw new Error("Discord SDK yüklenemedi");
      discordSdk=new window.DiscordEmbeddedAppSDK.DiscordSDK(clientId);
      await Promise.race([discordSdk.ready(),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Discord zaman aşımı")),9000))]);
      const instanceId=discordSdk.instanceId,channelId=discordSdk.channelId;
      if(!instanceId||!channelId)throw new Error("Activity bağlamı bulunamadı");
      const data=await bootstrapActivity(instanceId,channelId);
      roomId=data.roomId;controller=Boolean(data.controller);applyRole();connectEvents();apply(data);
    }catch(error){fail("Activity başlatılamadı",error.message||"Bilinmeyen hata")}
  }
  async function bootstrapActivity(instanceId,channelId){
    for(let attempt=1;attempt<=6;attempt++){
      const response=await fetch("/api/activity/bootstrap",{method:"POST",credentials:"include",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"instanceId="+encodeURIComponent(instanceId)+"&channelId="+encodeURIComponent(channelId)});
      const data=await response.json();if(response.ok)return data;
      if(response.status!==403||attempt===6)throw new Error("Oturum doğrulanamadı ("+response.status+")");
      byId("loadingDetail").textContent="Discord video odası hazırlanıyor… ("+attempt+"/6)";await new Promise(resolve=>setTimeout(resolve,700));
    }
  }
  function applyRole(){
    byId("chrome").classList.toggle("viewer-mode",!controller);byId("player").classList.toggle("viewer",!controller);byId("seek").disabled=!controller;
    byId("role").textContent=controller?"Yayın sahibi":"İzleyici";byId("role").classList.toggle("host",controller);
  }
  function showSourceGate(){
    byId("loading").classList.add("hidden");byId("sourceGate").classList.remove("hidden");
    byId("sourceFields").style.display=controller?"flex":"none";byId("sourceTitle").textContent=controller?"Yayını başlat":"Yayın bekleniyor";
    byId("sourceHint").textContent=controller?"Yerleştirmeye izin veren YouTube bağlantısını gir.":"Oda sahibi videoyu seçtiğinde yayın otomatik başlayacak.";
    if(controller)setTimeout(()=>byId("sourceUrl").focus(),60);
  }
  function createPlayer(id){
    clearTimeout(playbackWatchdog);
    videoId=id;playerReady=false;playerState=-1;playerCurrent=0;playerDuration=0;byId("sourceGate").classList.add("hidden");
    byId("loading").classList.remove("hidden");byId("loadingTitle").textContent="Video açılıyor…";byId("loadingDetail").textContent="YouTube güvenli Discord proxy’si üzerinden yükleniyor.";byId("loadingDetail").classList.remove("error");
    byId("player").replaceChildren();playerFrame=document.createElement("iframe");playerFrame.id="youtube-player";playerFrame.title="Fluir video yayını";
    playerFrame.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";playerFrame.allowFullscreen=true;playerFrame.loading="eager";playerFrame.referrerPolicy="strict-origin-when-cross-origin";
    const origin=location.origin,params=new URLSearchParams({enablejsapi:"1",autoplay:"1",playsinline:"1",rel:"0",controls:"0",disablekb:"1",fs:"0",origin,widget_referrer:origin});
    playerFrame.src="/youtube-embed/"+encodeURIComponent(id)+"?"+params;
    playerFrame.onload=()=>{playerReady=true;byId("loading").classList.add("hidden");announceListener();setTimeout(announceListener,400);setTimeout(announceListener,1200);fetchState();showControls()};
    byId("player").appendChild(playerFrame);
  }
  function playerCommand(func,args=[]){if(playerFrame?.contentWindow)playerFrame.contentWindow.postMessage(JSON.stringify({event:"command",func,args,id:"youtube-player"}),"*")}
  function armPlaybackWatchdog(){clearTimeout(playbackWatchdog);playbackWatchdog=setTimeout(()=>{if(playerState!==PLAYING&&playerDuration<=0)fail("Video akışı başlatılamadı","YouTube bu videoyu Discord Activity içinde aktarmadı. Yerleştirmeye açık başka bir video dene.")},12000)}
  function announceListener(){if(!playerFrame?.contentWindow)return;playerFrame.contentWindow.postMessage(JSON.stringify({event:"listening",id:"youtube-player"}),"*");["onReady","onStateChange","onError","onApiChange"].forEach(name=>playerCommand("addEventListener",[name]))}
  window.addEventListener("message",event=>{
    if(!playerFrame||event.source!==playerFrame.contentWindow)return;let message;try{message=typeof event.data==="string"?JSON.parse(event.data):event.data}catch{return}if(!message||typeof message!=="object")return;
    if(message.event==="onReady"){playerReady=true;byId("loading").classList.add("hidden");fetchState();return}
    if(message.event==="onError"){const code=Number(message.info),detail=code===101||code===150?"Video sahibi başka sitelerde oynatmaya izin vermiyor.":code===153?"YouTube oynatıcı kimliği doğrulanamadı; başka bir video dene.":"YouTube hata kodu: "+code;fail("Video açılamadı",detail);return}
    if(message.event==="onStateChange"){playerState=Number(message.info);if(playerState===PLAYING)clearTimeout(playbackWatchdog);byId("play").textContent=playerState===PLAYING?"❚❚":"▶";if(controller&&!applying){if(playerState===PLAYING)sendControl("play",playerCurrent);if(playerState===PAUSED)sendControl("pause",playerCurrent)}return}
    if(message.event==="infoDelivery"&&message.info){if(Number.isFinite(message.info.currentTime))playerCurrent=message.info.currentTime;if(Number.isFinite(message.info.duration))playerDuration=message.info.duration;if(playerDuration>0||playerCurrent>0)clearTimeout(playbackWatchdog);if(message.info.playerState!==undefined)playerState=Number(message.info.playerState)}
  });
  function connectEvents(){events=new EventSource("/api/watch/"+roomId+"/events");events.addEventListener("state",event=>apply(JSON.parse(event.data)));events.onopen=()=>byId("status").textContent="Canlı · güvenli bağlantı";events.onerror=()=>byId("status").textContent="Yeniden bağlanıyor…"}
  function expected(state){return state.position+(state.playing?(Date.now()-state.serverTime)/1000:0)}
  function apply(state){
    lastRemote=state;if(!state.videoId){showSourceGate();return}if(state.videoId!==videoId){createPlayer(state.videoId);return}if(!playerReady)return;
    const target=expected(state),diff=target-playerCurrent;applying=true;if(Math.abs(diff)>1.4)playerCommand("seekTo",[target,true]);if(state.playing&&playerState!==PLAYING){playerCommand("playVideo");armPlaybackWatchdog()}if(!state.playing&&playerState===PLAYING)playerCommand("pauseVideo");setTimeout(()=>applying=false,650);
  }
  async function sendControl(action,position=0,source=""){
    if(!controller||!roomId)return false;const body=new URLSearchParams({action,position:String(position)});if(source)body.set("source",source);
    const response=await fetch("/api/watch/"+roomId+"/control",{method:"POST",credentials:"include",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
    if(response.status===403){controller=false;applyRole();byId("status").textContent="Kontrol yalnızca oda sahibinde";return false}if(!response.ok)return false;apply(await response.json());return true;
  }
  function fetchState(){if(roomId)fetch("/api/watch/"+roomId+"/state",{credentials:"include"}).then(r=>r.json()).then(apply).catch(()=>{})}
  byId("sourceForm").addEventListener("submit",async event=>{event.preventDefault();const input=byId("sourceUrl"),button=byId("sourceForm").querySelector("button");button.disabled=true;byId("sourceError").textContent="";const ok=await sendControl("source",0,input.value.trim());button.disabled=false;if(!ok)byId("sourceError").textContent="Bu bağlantı desteklenmiyor veya video yerleştirmeye kapalı."});
  byId("play").onclick=()=>sendControl(playerState===PLAYING?"pause":"play",playerCurrent);byId("back").onclick=()=>sendControl("seek",Math.max(0,playerCurrent-10));byId("forward").onclick=()=>sendControl("seek",Math.min(playerDuration||86400,playerCurrent+10));
  byId("seek").onpointerdown=()=>seeking=true;byId("seek").oninput=event=>{if(playerDuration)byId("current").textContent=clock(playerDuration*Number(event.target.value)/100)};byId("seek").onchange=event=>{seeking=false;if(playerDuration)sendControl("seek",playerDuration*Number(event.target.value)/100)};
  byId("captions").onchange=event=>{const language=event.target.value;if(language==="off"){playerCommand("unloadModule",["captions"]);return}playerCommand("loadModule",["captions"]);setTimeout(()=>playerCommand("setOption",["captions","track",{languageCode:language}]),180)};
  byId("mute").onclick=()=>{muted=!muted;playerCommand(muted?"mute":"unMute");byId("mute").textContent=muted?"🔇":"🔊"};byId("fullscreen").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else byId("stage").requestFullscreen?.()};
  byId("stage").addEventListener("mousemove",showControls);byId("stage").addEventListener("pointerdown",showControls);byId("stage").addEventListener("touchstart",showControls,{passive:true});
  setInterval(()=>{if(!playerReady)return;const current=lastRemote?expected(lastRemote):playerCurrent;if(!seeking){byId("current").textContent=clock(current);byId("seek").value=playerDuration?String(Math.min(100,current/playerDuration*100)):"0"}byId("duration").textContent=clock(playerDuration)},500);
  boot();
</script>
</body>
</html>
