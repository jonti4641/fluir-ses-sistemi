name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B --no-transfer-progress verify
      - run: docker build --pull -t fluir:ci .
      - run: docker run --rm -e DATA_DIR=/tmp/fluir fluir:ci --smoke-test
